[package]
cairo-version = "2.13.1"
name = "rollyourown"
version = "0.1.0"
edition = "2024_07"

[cairo]
# sierra-replace-ids = true

[tool.fmt]
sort-module-level-items = true
max-line-length = 100
tab-size = 4

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = [
    "dojo::world::world_contract::world",
    "achievement::events::index::e_TrophyCreation",
    "achievement::events::index::e_TrophyProgression",
    # PR-1f: bundle component models + events. cairo_test needs every
    # external Cairo class declared here so spawn_test_world can find
    # the class hash at register time. The bundle package ships its
    # own Bundle / BundleIssuance / BundleReferral / BundleGroup /
    # BundleVoucher models that the embedded BundleComponent reads
    # and writes via the dopewars purchase contract's WorldStorage.
    "bundle::models::index::m_Bundle",
    "bundle::models::index::m_BundleIssuance",
    "bundle::models::index::m_BundleReferral",
    "bundle::models::index::m_BundleGroup",
    "bundle::models::index::m_BundleVoucher",
    "bundle::events::index::e_BundleRegistered",
    "bundle::events::index::e_BundleUpdated",
    "bundle::events::index::e_BundleIssued",
]


[dependencies]
starknet = "2.13.1"
dojo = "1.8.0"
openzeppelin = "3.0.0"

# cartridge_vrf: dropped in PR-0b. The cartridge-gg/vrf package is pinned to
# openzeppelin 2.x and blocks the v2 OZ 3.0 upgrade. We vendor a minimal
# IVrfProvider trait at src/interfaces/vrf.cairo (matching the production
# VRF ABI) and use a hash-based mock for dev. See docs/V2_DESIGN.md.

achievement = { git = "https://github.com/cartridge-gg/arcade", rev = "fc2e81c" }
# achievement = { git = "https://github.com/cartridge-gg/arcade" }

# PR-1f: bundle component for the v2 starterpack purchase flow. Mirrors
# nums' Setup contract — we embed BundleComponent directly into the
# purchase contract to get USDC payment + fee distribution + on_issue
# callback for free, without deploying a separate registry contract.
# Same arcade rev as `achievement` above so deps stay consistent.
bundle = { git = "https://github.com/cartridge-gg/arcade", rev = "fc2e81c" }

# dope_types: dropped in PR-0a (v2 reset). v2 hustlers are native Starknet,
# minted by the new starterpack purchase flow. See docs/V2_DESIGN.md.

# PR-2: enable `scarb test`. Without these dev-deps the cairo_test plugin
# isn't loaded and every #[test] attribute reports "Unsupported attribute".
[dev-dependencies]
cairo_test = "2.13.1"
dojo_cairo_test = "1.8.0"

[scripts]
katana = "katana --config ./katana_dev.toml"
katana_with_db = "katana --config ./katana_dev.toml --db-dir db"
torii = "torii --config ./torii_dev.toml"

# common
copy_manifest = "./scripts/copy_manifest.sh"
gendojo = "./scripts/gen.sh"
auth = "./scripts/auth.sh"
emit_items = "./scripts/emit_items.sh"

# migrate  && scarb run gendojo $PROFILE
migrate = "PROFILE=dev && sozo -P $PROFILE build && sozo -P $PROFILE migrate -vvv && scarb run copy_manifest $PROFILE && scarb run auth $PROFILE && scarb run gendojo $PROFILE && sozo -P $PROFILE inspect"
migrate_dopewars = "PROFILE=dopewars && sozo -P $PROFILE build && sozo -P $PROFILE migrate -vvv && scarb run copy_manifest $PROFILE && scarb run auth $PROFILE && sozo -P $PROFILE inspect"
#
migrate_sepolia = "PROFILE=sepolia && sozo -P $PROFILE build && sozo -P $PROFILE migrate -vvv && scarb run copy_manifest $PROFILE && scarb run auth $PROFILE && sozo -P $PROFILE inspect"
migrate_mainnet = "PROFILE=mainnet && sozo -P $PROFILE build && sozo -P $PROFILE migrate -vvv && scarb run copy_manifest $PROFILE && scarb run auth $PROFILE && sozo -P $PROFILE inspect"

# slot dopewars
slot_dopewars_katana = "slot d create -t pro --team cartridge dopewars katana --config ./katana_dopewars.toml"
slot_dopewars_torii = "slot d create -t epic --team cartridge dopewars torii --version v1.7.3 --config ./torii_dopewars.toml"

# slot sepolia 
slot_sepolia_torii = "slot d create  -t pro --team cartridge ryosepolia2 torii --version v1.8.6 --config ./torii_ryosepolia2.toml"

# slot mainnet 
slot_mainnet_torii = "slot d create -t legendary --team cartridge ryomainnet3 torii --version v1.8.6 --config ./torii_mainnet.toml"

# slot ryomainnet
# slot_ryomainnet_torii = "slot d create --tier rare ryomainnet torii -v v1.0.5 --config ./torii_mainnet.toml" 
# slot_ryomainnet_torii = "slot d create --tier legendary ryomainnet torii -v v1.0.5 --config ./torii_mainnet.toml" # with slot v0.34.0

[profile.dopewars]
[profile.sepolia]
[profile.mainnet]

