[env]
rpc_url = "https://api.cartridge.gg/x/starknet/sepolia"

account_address = "0x025Ee38b230906EA41B00401cC12bb51f58DC62198cf058a336655696908863D"
keystore_path = "../keystore.json"

[world]
name = "Dope Wars V2"
seed = "dopeseed_v3"
description = "Dope Wars V2 — fresh world with starterpacks, daily marketplace, and native hustler NFTs."

[namespace]
default = "dopewars"

[migration]
skip_contracts = ["dopewars-ekubo_router_mock", "dopewars-devtools"]
# Ensure tokens init before contracts that read them from DNS
order_inits = [
    "dopewars-paper",
    "dopewars-paper_mock",
    "dopewars-hustler",
    "dopewars-content",
    "dopewars-ryo",
    "dopewars-purchase",
    "dopewars-marketplace",
    "dopewars-game",
]

[init_call_args]
# paper.dojo_init(admin) — grants DEFAULT_ADMIN_ROLE
"dopewars-paper" = [
    "0x025Ee38b230906EA41B00401cC12bb51f58DC62198cf058a336655696908863D", # admin = deployer
]
# hustler.dojo_init(admin) — grants DEFAULT_ADMIN_ROLE
"dopewars-hustler" = [
    "0x025Ee38b230906EA41B00401cC12bb51f58DC62198cf058a336655696908863D", # admin = deployer
]
"dopewars-ryo" = [
    "0x0",                                                                # paper address, 0x0 = use world.dns for paper_mock
    "0x051fea4450da9d6aee758bdeba88b2f665bcbf549d2c61421aa724e9ac0ced8f", # vrf address (sepolia VRF provider)
    "0x44cea566ac53bf7c36b298e36536c1a53ba0b0bdf66b2c5f437965605acface",  # treasury: click_save controller address
    "3600",                                                               # season_duration: u32, 60 min
    "300",                                                                # season_time_limit: u16 5min
]
# purchase.dojo_init — writes PaymentConfig + registers 4 bundles.
# Ekubo addresses from nums sepolia. pool_sqrt auto-computed from token ordering.
"dopewars-purchase" = [
    "0x053b40a647cedfca6ca84f542a0fe36736031905a9639a7f19a3c1e66bfd5080", # usdc (sepolia USDC)
    "0x050d4da9f66589eadaa1d5e31cf73b08ac1a67c8b4dcd88e6fd4fe501c628af2", # ekubo_router (sepolia)
    "0x06a2aee84bb0ed5dded4384ddd0e40e9c1372b818668375ab8e3ec08807417e5", # ekubo_positions (sepolia)
    "0xccccccccccccccccccccccccccccccc",                                   # pool_fee (0.3%)
    "0x56a4c",                                                            # pool_tick_spacing (355884)
    "0x073ec792c33b52d5f96940c2860d512b3884f2127d25e023eb9d44a678e4b971", # pool_extension (sepolia)
    "0x1E8480", "0x0",                                                    # base_price (u256) = 2 USDC (6 decimals)
    "70",                                                                 # burn_percentage
    "20",                                                                 # treasury_percentage
    "0x44cea566ac53bf7c36b298e36536c1a53ba0b0bdf66b2c5f437965605acface",  # treasury_address
]
# marketplace.dojo_init — per-tier PAPER prices + burn split.
"dopewars-marketplace" = [
    "0x1B1AE4D6E2EF500000", "0x0",                                       # tier1_price: 500 PAPER (u256)
    "0xAD78EBC5AC6200000", "0x0",                                         # tier2_price: 200 PAPER (u256)
    "0x2B5E3AF16B1880000", "0x0",                                         # tier3_price: 50 PAPER (u256)
    "50",                                                                 # burn_percentage
]


[writers]

# namespace-wide writer for devtools
"dopewars" = ["dopewars-devtools"]

#
# token events
#
"dopewars-ERC20BalanceEvent" = ["dopewars-paper", "dopewars-paper_mock"]

#
# config models
#
"dopewars-GameConfig" = [
    "dopewars-config",
    "dopewars-ryo",
]
"dopewars-DrugConfig" = ["dopewars-config"]
"dopewars-LocationConfig" = ["dopewars-config"]
"dopewars-EncounterStatsConfig" = ["dopewars-config"]

#
# game models
#
"dopewars-Game" = ["dopewars-game", "dopewars-decide"]
"dopewars-GameStorePacked" = ["dopewars-game", "dopewars-decide"]
"dopewars-RyoConfig" = ["dopewars-game", "dopewars-ryo"]
"dopewars-Season" = ["dopewars-game", "dopewars-ryo"]
"dopewars-SeasonSettings" = [
    "dopewars-game",
    "dopewars-ryo",
]
"dopewars-SortedList" = ["dopewars-game"]
"dopewars-SortedListItem" = ["dopewars-game"]
"dopewars-RyoAddress" = ["dopewars-ryo"]

#
# v2: hustler + gear models
#
"dopewars-HustlerInstance" = ["dopewars-purchase", "dopewars-game", "dopewars-marketplace"]
"dopewars-HustlerTemplate" = ["dopewars-content"]
"dopewars-GearTemplate" = ["dopewars-content"]
"dopewars-GearInstance" = ["dopewars-marketplace"]
"dopewars-Starterpack" = ["dopewars-purchase"]
"dopewars-PaymentConfig" = ["dopewars-purchase"]
"dopewars-MarketConfig" = ["dopewars-marketplace"]
"dopewars-DailyPurchase" = ["dopewars-marketplace"]

#
# v2: bundle component models (from arcade crate)
#
"dopewars-Bundle" = ["dopewars-purchase"]
"dopewars-BundleIssuance" = ["dopewars-purchase"]
"dopewars-BundleReferral" = ["dopewars-purchase"]
"dopewars-BundleGroup" = ["dopewars-purchase"]
"dopewars-BundleVoucher" = ["dopewars-purchase"]

#
# game events
#
"dopewars-GameCreated" = ["dopewars-game"]
"dopewars-Traveled" = ["dopewars-game", "dopewars-decide"]
"dopewars-GameOver" = ["dopewars-game", "dopewars-decide"]
"dopewars-TradeDrug" = ["dopewars-game", "dopewars-decide"]
"dopewars-UpgradeItem" = ["dopewars-game", "dopewars-decide"]
"dopewars-HighVolatility" = ["dopewars-game", "dopewars-decide"]
"dopewars-TravelEncounter" = ["dopewars-game", "dopewars-decide"]
"dopewars-TravelEncounterResult" = ["dopewars-game", "dopewars-decide"]

#
# v2: bundle events (from arcade crate)
#
"dopewars-BundleRegistered" = ["dopewars-purchase"]
"dopewars-BundleUpdated" = ["dopewars-purchase"]
"dopewars-BundleIssued" = ["dopewars-purchase"]

# bushido
"dopewars-TrophyProgression" = [
    "dopewars-game",
    "dopewars-decide",
]
"dopewars-TrophyCreation" = ["dopewars-ryo"]

# items (legacy, still referenced by game loop)
"dopewars-DopewarsItemTier" = ["dopewars-config"]
"dopewars-DopewarsItemTierConfig" = ["dopewars-config"]

[lib_versions]
"dopewars-DopewarsItems" = "0"
