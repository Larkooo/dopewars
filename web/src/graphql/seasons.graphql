query SeasonByVersion($version: u16) {
  dopewarsSeasonModels(where: { version: $version }) {
    edges {
      node {
        version
        season_duration
        season_time_limit
        next_version_timestamp
        high_score
      }
    }
  }

  dopewarsSeasonSettingsModels(where: { season_version: $version }) {
    edges {
      node {
        season_version
        cash_mode
        health_mode
        turns_mode
        drugs_mode
        encounters_mode
        encounters_odds_mode
        wanted_mode
      }
    }
  }
}

query Seasons {
  dopewarsSeasonModels(limit: 420, order: { field: VERSION, direction: DESC }) {
    edges {
      node {
        version
        season_duration
        season_time_limit
        next_version_timestamp
        high_score
      }
    }
  }

  dopewarsSeasonSettingsModels(limit: 420) {
    edges {
      node {
        season_version
        cash_mode
        health_mode
        turns_mode
        drugs_mode
        encounters_mode
        encounters_odds_mode
      }
    }
  }
}

query SeasonSettings($version: u16) {
  dopewarsSeasonSettingsModels(where: { season_version: $version }) {
    edges {
      node {
        season_version
        cash_mode
        health_mode
        turns_mode
        drugs_mode
        encounters_mode
        encounters_odds_mode
      }
    }
  }
}

query AllSeasonSettings {
  dopewarsSeasonSettingsModels(limit: 420) {
    edges {
      node {
        season_version
        cash_mode
        health_mode
        turns_mode
        drugs_mode
        encounters_mode
        encounters_odds_mode
      }
    }
  }
}

query HallOfFame {
  dopewarsGameModels(limit: 420, where: { registered: true }, order: { field: SEASON_VERSION, direction: DESC }) {
    edges {
      node {
        game_id
        player_id
        player_name {
          value
        }
        multiplier
        season_version
        final_score
        hustler_token_id
        reward
        equipment_by_slot
      }
    }
  }
}

query Claimable($playerId: ContractAddress) {
  dopewarsGameModels(where: { player_id: $playerId, registered: true }) {
    edges {
      node {
        game_id
        season_version
        player_id
        player_name {
          value
        }
        hustler_token_id
        reward
        equipment_by_slot
        final_score
      }
    }
  }
}

query GameOverEvents($gameOverSelector: String, $version: String) {
  events(last: 1000, keys: [$gameOverSelector, "*", "*", $version]) {
    totalCount
    edges {
      node {
        id
        transactionHash
        keys
        data
        createdAt
      }
    }
  }
}
