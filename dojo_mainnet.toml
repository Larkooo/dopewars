
[env]
rpc_url = "https://api.cartridge.gg/x/starknet/mainnet"
account_address = "0x0105820d3243890dae5351800d5edae42bd6c129f6a0dde9fe5ecfb8a1a9cbc3"
keystore_path = "../../prod_accounts/dope_key"
keystore_password = "dope_key"

[world]
name = "Dope Wars V2"
seed = "dopeseed_v2"
description = "Dope Wars V2 — fresh world with starterpacks, daily marketplace, and native hustler NFTs."

[namespace]
default = "dopewars"

[migration]
skip_contracts = [
    "dopewars-devtools",
    "dopewars-paper_mock",
    "dopewars-vrf_provider_mock",
    "dopewars-ekubo_router_mock",
]
order_inits = [
    "dopewars-paper",
    "dopewars-hustler",
    "dopewars-content",
    "dopewars-ryo",
    "dopewars-purchase",
    "dopewars-marketplace",
    "dopewars-game",
]

[init_call_args]
# paper.dojo_init(admin) — grants DEFAULT_ADMIN_ROLE
"dopewars-paper" = [
    "0x026C8df51A3b2652b6FaFD2d38ea0639f9131Ef097507758adef6E983Bcb7106", # admin = mainnet multisig/treasury
]
# hustler.dojo_init(admin) — grants DEFAULT_ADMIN_ROLE
"dopewars-hustler" = [
    "0x026C8df51A3b2652b6FaFD2d38ea0639f9131Ef097507758adef6E983Bcb7106", # admin = mainnet multisig/treasury
]
"dopewars-ryo" = [
    "0x0",                                                                # paper address, 0x0 = use world.dns for paper contract
    "0x051fea4450da9d6aee758bdeba88b2f665bcbf549d2c61421aa724e9ac0ced8f", # vrf address (mainnet VRF provider)
    "0x026C8df51A3b2652b6FaFD2d38ea0639f9131Ef097507758adef6E983Bcb7106", # treasury / multisig address
    "604800",                                                             # season_duration: u32, 1 week
    "1800",                                                               # season_time_limit: u16 30min
]
# purchase.dojo_init — writes PaymentConfig + registers 4 bundles.
# Ekubo addresses from nums mainnet. pool_sqrt auto-computed from token ordering.
"dopewars-purchase" = [
    "0x053c91253bc9682c04929ca02ed00b3e423f6710d2ee7e0d5ebb06f3ecf368a8", # usdc (mainnet USDC)
    "0x04505a9f06f2bd639b6601f37a4dc0908bb70e8e0e0c34b1220827d64f4fc066", # ekubo_router (mainnet)
    "0x02e0af29598b407c8716b17f6d2795eca1b471413fa03fb145a5e33722184067", # ekubo_positions (mainnet)
    "0xccccccccccccccccccccccccccccccc",                                   # pool_fee (0.3%)
    "0x56a4c",                                                            # pool_tick_spacing (355884)
    "0x043e4f09c32d13d43a880e85f69f7de93ceda62d6cf2581a582c6db635548fdc", # pool_extension (mainnet)
    "0x1E8480", "0x0",                                                    # base_price (u256) = 2 USDC (6 decimals)
    "70",                                                                 # burn_percentage
    "20",                                                                 # treasury_percentage
    "0x026C8df51A3b2652b6FaFD2d38ea0639f9131Ef097507758adef6E983Bcb7106", # treasury_address
]
# marketplace.dojo_init — per-tier PAPER prices + burn split.
"dopewars-marketplace" = [
    "0x1B1AE4D6E2EF500000", "0x0",                                       # tier1_price: 500 PAPER (u256)
    "0xAD78EBC5AC6200000", "0x0",                                         # tier2_price: 200 PAPER (u256)
    "0x2B5E3AF16B1880000", "0x0",                                         # tier3_price: 50 PAPER (u256)
    "50",                                                                 # burn_percentage
]


