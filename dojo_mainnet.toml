
[env]
rpc_url = "https://api.cartridge.gg/x/starknet/mainnet"
account_address = "0x0105820d3243890dae5351800d5edae42bd6c129f6a0dde9fe5ecfb8a1a9cbc3"
keystore_path = "../../prod_accounts/dope_key"
keystore_password = "dope_key"

[world]
name = "Dope Wars V2"
seed = "dopeseed_v2"
description = "Dope Wars V2 — fresh world with starterpacks, daily marketplace, and native hustler NFTs."

[namespace]
default = "dopewars"

[migration]
# skip dev-only mocks and devtools on mainnet
skip_contracts = [
    "dopewars-devtools",
    "dopewars-paper_mock",
    "dopewars-vrf_provider_mock",
    "dopewars-ekubo_router_mock",
]

[init_call_args]
"dopewars-ryo" = [
    "0x0",                                                                # paper address, 0x0 = use world.dns for paper contract
    "0x051fea4450da9d6aee758bdeba88b2f665bcbf549d2c61421aa724e9ac0ced8f", # vrf address (mainnet VRF provider)
    "0x026C8df51A3b2652b6FaFD2d38ea0639f9131Ef097507758adef6E983Bcb7106", # treasury / multisig address
    "604800",                                                             # season_duration: u32, 1 week
    "1800",                                                               # season_time_limit: u16 30min
]
# purchase.dojo_init takes an admin address
"dopewars-purchase" = [
    "0x0105820d3243890dae5351800d5edae42bd6c129f6a0dde9fe5ecfb8a1a9cbc3", # admin = mainnet deployer
]


[writers]

#
# token events
#
# "dopewars-ERC20BalanceEvent" = ["dopewars-paper"]

#
# config models
#
"dopewars-GameConfig" = [
    "dopewars-config",
    "dopewars-ryo",
]
"dopewars-DrugConfig" = ["dopewars-config"]
"dopewars-LocationConfig" = ["dopewars-config"]
"dopewars-EncounterStatsConfig" = ["dopewars-config"]

#
# game models
#
"dopewars-Game" = ["dopewars-game", "dopewars-decide"]
"dopewars-GameStorePacked" = ["dopewars-game", "dopewars-decide"]
"dopewars-RyoConfig" = ["dopewars-game", "dopewars-ryo"]
"dopewars-Season" = ["dopewars-game", "dopewars-ryo"]
"dopewars-SeasonSettings" = [
